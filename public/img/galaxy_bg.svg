<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Background wash behind the login card gradient; stands in for the
       reference build's own full-bleed artwork. -->
  <defs>
    <radialGradient id="glowA" cx="18%" cy="20%" r="55%">
      <stop offset="0" stop-color="#ff6f00" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="78%" r="55%">
      <stop offset="0" stop-color="#2e7d32" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2e7d32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="150" r="2"/><circle cx="310" cy="90" r="1.5"/><circle cx="470" cy="230" r="2.5"/>
    <circle cx="700" cy="120" r="1.5"/><circle cx="880" cy="260" r="2"/><circle cx="1040" cy="80" r="1.5"/>
    <circle cx="1230" cy="210" r="2.5"/><circle cx="1420" cy="130" r="1.5"/><circle cx="1540" cy="300" r="2"/>
    <circle cx="180" cy="470" r="1.5"/><circle cx="360" cy="620" r="2"/><circle cx="610" cy="540" r="1.5"/>
    <circle cx="820" cy="680" r="2.5"/><circle cx="1010" cy="590" r="1.5"/><circle cx="1180" cy="720" r="2"/>
    <circle cx="1360" cy="640" r="1.5"/><circle cx="1500" cy="520" r="2"/><circle cx="250" cy="800" r="1.5"/>
    <circle cx="540" cy="830" r="2"/><circle cx="960" cy="860" r="1.5"/><circle cx="1290" cy="840" r="2"/>
  </g>

  <g transform="translate(800 450)" opacity="0.07">
    <circle r="210" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle r="300" fill="none" stroke="#ffffff" stroke-width="4"/>
    <ellipse rx="430" ry="140" fill="none" stroke="#ffffff" stroke-width="8" transform="rotate(-18)"/>
    <text y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="120" font-weight="900" letter-spacing="18" fill="#ffffff">GALAXY</text>
  </g>
</svg>
